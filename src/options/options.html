<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Steam Enhancer — Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <header class="top">
    <img src="../../icons/icon128.png" alt="" width="40" height="40" />
    <div class="title">
      <h1>Steam Enhancer</h1>
      <p id="version"></p>
    </div>
    <input type="search" id="search" data-i18n-placeholder="optSearch" placeholder="Search settings…" />
    <span id="status" class="status" role="status" aria-live="polite"></span>
  </header>

  <div class="layout">
    <nav id="nav" aria-label="Sections"></nav>
    <main id="sections"></main>
  </div>

  <footer>
    <p data-i18n="optFooterUnofficial">Steam Enhancer is an unofficial enhancement tool. Not affiliated with Valve or Steam.</p>
    <p><a href="https://github.com/DrummingBird1/steam-enhancer" target="_blank" rel="noopener" data-i18n="optSourceLink">Source on GitHub</a></p>
  </footer>

  <input id="import-file" type="file" accept="application/json" hidden />
  <script src="../lib/storage.js"></script>
  <script src="../lib/health.js"></script>
  <script src="options.js"></script>
</body>
</html>
