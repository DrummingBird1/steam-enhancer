<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Steam Enhancer</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img src="../../icons/icon48.png" alt="" width="32" height="32" />
    <div>
      <h1>Steam Enhancer</h1>
      <p id="version">v1.0.0</p>
    </div>
  </header>

  <section class="actions">
    <button data-go="https://store.steampowered.com/" data-i18n="openStore">Open Steam Store</button>
    <button data-go="https://store.steampowered.com/wishlist/" data-i18n="myWishlist">My Wishlist</button>
    <button data-go="https://steamcommunity.com/my/inventory/" data-i18n="myInventory">My Inventory</button>
    <button data-go="https://isthereanydeal.com/">IsThereAnyDeal</button>
  </section>

  <section class="toggles">
    <label><input type="checkbox" data-setting="showLowestPrice" /> <span data-i18n="tShowLowest">Show lowest prices</span></label>
    <label><input type="checkbox" data-setting="highlightOwned" /> <span data-i18n="tHighlightOwned">Highlight owned games</span></label>
    <label><input type="checkbox" data-setting="highlightWishlist" /> <span data-i18n="tHighlightWish">Highlight wishlisted</span></label>
    <label><input type="checkbox" data-setting="hideIgnoredInSearch" /> <span data-i18n="tHideIgnored">Hide ignored in search</span></label>
    <label><input type="checkbox" data-setting="showProtonDB" /> <span data-i18n="tShowProton">Show ProtonDB rating</span></label>
    <label><input type="checkbox" data-setting="showRegionalPricing" /> <span data-i18n="tShowRegional">Show regional prices</span></label>
    <label><input type="checkbox" data-setting="notifyWishlistDeals" /> <span data-i18n="tNotifyDeals">Notify on wishlist deals</span></label>
  </section>

  <footer>
    <button id="open-options" data-i18n="allSettings">All settings…</button>
    <button id="clear-cache" data-i18n="clearCache">Clear cache</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
